version: '3.2'

services:

  nginx:
    container_name: mlm-nginx
    image: nginx:latest
    ports:
      - '8083:80'
    volumes:
      - ./docker/nginx/conf:/etc/nginx/conf.d
      - ./:/var/www/mlm
      - ./docker/nginx/log:/var/log/nginx
    links:
      - php

  php:
    container_name: mlm-php
    build: ./docker/php
    environment:
      PROJECT_DIR: /var/www/mlm
      PHP_IDE_CONFIG: "serverName=Docker"
    volumes:
      - ./:/var/www/mlm
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini
    links:
      - mysql
    depends_on:
      - mysql

  mysql:
    container_name: mlm-mysql
    # ИСПРАВЛЕНИЕ 1: Использование MySQL 5.7 для обеспечения совместимости с дампом
    image: mysql:5.7
    ports:
      - '33063:3306'
    environment:
      - MYSQL_ROOT_PASSWORD=verysecret
      - MYSQL_DATABASE=mlm
      - MYSQL_USER=mlmuser
      - MYSQL_PASSWORD=mlmpassword
    command:
      # Флаг log-bin-trust-function-creators=1 оставляем как страховку,
      # хотя в 5.7 он менее критичен, если нет бинарного логирования.
      --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      --log-bin-trust-function-creators=1
    volumes:
      - mlm-db-vol:/var/lib/mysql
      # Предполагаем, что init.sql - это схема/данные
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      # ИСПРАВЛЕНИЕ 2: Корректное монтирование файла routines.sql
      # (Файл должен быть доступен по пути ./docker/mysql/routines.sql)
      - ./docker/mysql/routines.sql:/docker-entrypoint-initdb.d/routines.sql
      - ./docker/mysql/clear_dump.sql:/docker-entrypoint-initdb.d/clear_dump.sql

volumes:
  mlm-db-vol: